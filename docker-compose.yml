services:
  backend:
    build: .
    image: linkdecadastro-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3333"
      TZ: ${TZ:-America/Fortaleza}
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "3333:3333"

volumes:
  uploads:
